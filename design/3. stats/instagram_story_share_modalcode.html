<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>scoor! - Share Monthly Report</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f42525",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<!-- iOS Style Container -->
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Background content (Blurred app state) -->
<div class="absolute inset-0 z-0 opacity-40 blur-sm pointer-events-none p-6">
<div class="flex items-center gap-2 mb-8">
<div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm">leaderboard</span>
</div>
<h1 class="font-bold text-xl text-primary">scoor!</h1>
</div>
<div class="space-y-4">
<div class="h-32 w-full bg-slate-200 rounded-xl"></div>
<div class="h-64 w-full bg-slate-200 rounded-xl"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-24 bg-slate-200 rounded-xl"></div>
<div class="h-24 bg-slate-200 rounded-xl"></div>
</div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 z-10 bg-slate-900/40 backdrop-blur-md"></div>
<!-- Bottom Sheet Modal -->
<div class="relative z-20 flex h-full w-full flex-col justify-end">
<div class="flex flex-col items-stretch bg-background-light dark:bg-background-dark rounded-t-xl shadow-2xl border-t border-primary/10">
<!-- Handle Bar -->
<button class="flex h-8 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-primary/20"></div>
</button>
<div class="flex-1 pb-10">
<h4 class="text-primary text-sm font-bold uppercase leading-normal tracking-widest px-4 py-2 text-center">Share your month</h4>
<!-- Instagram Story Preview Card -->
<div class="p-6">
<div class="relative overflow-hidden aspect-[9/16] w-full max-w-sm mx-auto rounded-xl shadow-2xl bg-white flex flex-col items-center p-8 text-center border border-primary/5">
<!-- Subtle Gradient Background Pattern -->
<div class="absolute inset-0 opacity-5 pointer-events-none bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>
<!-- Logo Top -->
<div class="z-10 flex flex-col items-center gap-1 mb-8">
<span class="material-symbols-outlined text-primary text-4xl font-bold">analytics</span>
<span class="text-primary font-extrabold text-xl tracking-tighter">scoor!</span>
</div>
<!-- Header Section -->
<div class="z-10 mb-8">
<p class="text-primary/60 text-xs font-bold uppercase tracking-widest mb-1">Monthly Report</p>
<h2 class="text-primary text-4xl font-black tracking-tight leading-none">March<br/>Summary</h2>
</div>
<!-- Emotional Heatmap Mini (Abstract visualization) -->
<div class="z-10 w-full mb-8">
<div class="grid grid-cols-7 gap-1.5 p-3 rounded-lg bg-primary/5">
<div class="aspect-square bg-primary/80 rounded-sm"></div>
<div class="aspect-square bg-primary/40 rounded-sm"></div>
<div class="aspect-square bg-primary/90 rounded-sm"></div>
<div class="aspect-square bg-primary/20 rounded-sm"></div>
<div class="aspect-square bg-primary/10 rounded-sm"></div>
<div class="aspect-square bg-primary/60 rounded-sm"></div>
<div class="aspect-square bg-primary/70 rounded-sm"></div>
<!-- Row 2 -->
<div class="aspect-square bg-primary/30 rounded-sm"></div>
<div class="aspect-square bg-primary/100 rounded-sm"></div>
<div class="aspect-square bg-primary/50 rounded-sm"></div>
<div class="aspect-square bg-primary/90 rounded-sm"></div>
<div class="aspect-square bg-primary/10 rounded-sm"></div>
<div class="aspect-square bg-primary/60 rounded-sm"></div>
<div class="aspect-square bg-primary/40 rounded-sm"></div>
</div>
<p class="text-[10px] text-slate-400 mt-2 font-medium">Monthly score intensity</p>
</div>
<!-- Stats Section -->
<div class="z-10 flex flex-col gap-4 w-full">
<div class="flex justify-between items-center py-3 border-b border-primary/10">
<span class="text-slate-500 text-sm">Average</span>
<span class="text-slate-900 font-bold text-lg">78 pts</span>
</div>
<div class="flex justify-between items-center py-3 border-b border-primary/10">
<span class="text-slate-500 text-sm">Top Day</span>
<div class="text-right">
<p class="text-slate-900 font-bold text-lg leading-none">92</p>
<p class="text-primary text-[10px] font-bold">MAR 12</p>
</div>
</div>
<div class="flex justify-between items-center py-3 border-b border-primary/10">
<span class="text-slate-500 text-sm">Streak</span>
<span class="text-slate-900 font-bold text-lg">12 Days</span>
</div>
</div>
<!-- Footer -->
<div class="mt-auto pt-4">
<div class="w-12 h-1 bg-primary/20 mx-auto rounded-full mb-2"></div>
<p class="text-slate-400 text-[10px] font-medium tracking-tight">Generated by scoor! for iOS</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-center px-6 gap-4 flex-col max-w-sm mx-auto">
<button class="flex items-center justify-center gap-3 rounded-full h-14 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">share</span>
<span class="truncate">Share to Instagram Story</span>
</button>
<button class="flex items-center justify-center gap-3 rounded-full h-14 bg-transparent border-2 border-primary/20 text-slate-900 dark:text-slate-100 text-base font-bold active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">download</span>
<span class="truncate">Save to Gallery</span>
</button>
</div>
<!-- Dismiss area -->
<div class="mt-6 flex justify-center">
<button class="text-slate-400 text-sm font-medium hover:text-primary transition-colors">Not now</button>
</div>
</div>
</div>
</div>
</div>
</body></html>
