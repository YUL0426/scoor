<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>scoor! - Input Entry</title>

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-low text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full flex justify-between items-center px-6 py-4 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-lg border-b border-zinc-100 dark:border-zinc-800 shadow-sm z-50">
<div class="flex items-center gap-2">
<span class="text-2xl font-black italic text-[#f42525] uppercase tracking-tighter">scoor!</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
</header>
<main class="flex-1 mt-20 px-6 pb-40 max-w-lg mx-auto w-full">
<!-- Score Display Section -->
<section class="text-center py-8">
<div class="inline-block relative">
<span class="text-[8rem] font-black italic leading-none tracking-tighter text-primary">82</span>
<div class="absolute -top-2 -right-4 bg-primary text-on-primary text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded-full shadow-lg">NEW</div>
</div>
<p class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mt-2">What's the number for today?</p>
</section>
<!-- Reason Input Section -->
<section class="space-y-6">
<div class="relative">
<textarea class="w-full bg-surface border-none rounded-xl p-4 text-on-surface placeholder:text-zinc-400 focus:ring-2 focus:ring-primary/20 min-h-[120px] shadow-sm text-body" placeholder="Tell us more about your day..."></textarea>
<div class="absolute bottom-3 right-3 text-[10px] font-black text-zinc-300">0/280</div>
</div>
<!-- Quick Tags -->
<div class="space-y-3">
<h3 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant px-1">QUICK TAGS</h3>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 bg-surface text-on-surface text-[12px] font-bold rounded-full shadow-sm hover:bg-primary hover:text-on-primary transition-all duration-200 active:scale-95">Work</button>
<button class="px-4 py-2 bg-primary text-on-primary text-[12px] font-bold rounded-full shadow-sm active:scale-95">Family</button>
<button class="px-4 py-2 bg-surface text-on-surface text-[12px] font-bold rounded-full shadow-sm hover:bg-primary hover:text-on-primary transition-all duration-200 active:scale-95">Health</button>
<button class="px-4 py-2 bg-surface text-on-surface text-[12px] font-bold rounded-full shadow-sm hover:bg-primary hover:text-on-primary transition-all duration-200 active:scale-95">Hobbies</button>
<button class="px-4 py-2 bg-surface text-on-surface text-[12px] font-bold rounded-full shadow-sm hover:bg-primary hover:text-on-primary transition-all duration-200 active:scale-95">+ Custom</button>
</div>
</div>
</section>
</main>
<!-- Numeric Keypad & Action Container -->
<div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl rounded-t-[2.5rem] shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)] border-t border-zinc-100/50 z-50">
<!-- Keypad -->
<div class="grid grid-cols-3 gap-1 p-4 max-w-md mx-auto">
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">1</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">2</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">3</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">4</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">5</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">6</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">7</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">8</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">9</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">.</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">0</button>
<button class="h-14 flex items-center justify-center text-xl font-bold italic hover:bg-zinc-50 active:bg-zinc-100 rounded-xl transition-colors">
<span class="material-symbols-outlined text-zinc-400">backspace</span>
</button>
</div>
<!-- Action Button -->
<div class="px-6 pb-10 pt-2 flex justify-center">
<button class="w-full max-w-md bg-primary text-on-primary py-5 rounded-2xl flex items-center justify-center gap-3 shadow-primary/40 shadow-2xl active:scale-95 transition-transform group">
<span class="text-[10px] font-black uppercase tracking-widest">Save Entry</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="check_circle">check_circle</span>
</button>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-96 h-96 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</body></html>
